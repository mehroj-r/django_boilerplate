# Production stack. Uses its own compose project name so it never shares
# volumes or container names with the development stack.
name: "{{ cookiecutter.project_slug }}-prod"

services:
  db:
    container_name: "{{ cookiecutter.docker_name_prefix }}-db-prod"
    image: postgres:18-alpine
    volumes:
      # postgres:18+ requires the mount at /var/lib/postgresql, not
      # .../data -- the image refuses to start on the old path.
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      start_period: 10s
      interval: 5s
      retries: 5
    networks:
      - network-default
    restart: unless-stopped
    env_file:
      - .env

  web:
    container_name: "{{ cookiecutter.docker_name_prefix }}-web-prod"
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      CDN_ROOT: /cdn
    volumes:
      - app_data:/cdn
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "/app/scripts/healthcheck.sh" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - network-default
    restart: unless-stopped
    env_file:
      - .env

volumes:
  postgres_data:
  app_data:

networks:
  network-default:
    driver: bridge
