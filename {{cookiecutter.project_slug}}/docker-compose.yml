# Development stack. Uses its own compose project name so it never shares
# volumes or container names with the production stack.
name: "{{ cookiecutter.project_slug }}-dev"

services:
  db:
    container_name: "{{ cookiecutter.docker_name_prefix }}-db-dev"
    image: postgres:18-alpine
    volumes:
      # postgres:18+ requires the mount at /var/lib/postgresql, not
      # .../data -- the image refuses to start on the old path.
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5400}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      start_period: 10s
      interval: 5s
      retries: 5
    restart: unless-stopped
    env_file:
      - .env

  web:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    container_name: "{{ cookiecutter.docker_name_prefix }}-web-dev"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      CDN_ROOT: /cdn
    volumes:
      - app_data:/cdn
    ports:
      - "127.0.0.1:${APP_PORT:-8005}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env

volumes:
  postgres_data:
  app_data:
